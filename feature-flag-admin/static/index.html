<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Feature Flag Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f7f9; color: #1c1f23; }
    h1 { font-size: 20px; margin: 0; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .card { background: #fff; border: 1px solid #e2e5e9; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eceef1; vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; color: #6b7280; }
    input, select, button, textarea { font: inherit; padding: 6px 8px; border: 1px solid #cbd2d9; border-radius: 6px; }
    button { background: #1f6feb; color: #fff; border-color: #1f6feb; cursor: pointer; }
    button.secondary { background: #fff; color: #1c1f23; border-color: #cbd2d9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .pill { padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .on { background: #dcfce7; color: #166534; }
    .off { background: #f1f3f5; color: #495057; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .muted { color: #6b7280; font-size: 12px; }
    #error { color: #b42318; }
    ul.audit { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Feature Flag Admin</h1>
    <label>Acting as
      <select id="user"></select>
    </label>
    <span id="role" class="pill off"></span>
    <span id="error"></span>
  </header>

  <div class="card">
    <strong>New flag</strong>
    <div class="row" style="margin-top: 10px">
      <input id="n-name" placeholder="flag-name" />
      <input id="n-desc" placeholder="description" style="min-width: 240px" />
      <label>rollout % <input id="n-rollout" type="number" min="0" max="100" value="100" style="width: 72px" /></label>
      <input id="n-team" placeholder="target team (optional)" />
      <label><input id="n-enabled" type="checkbox" /> enabled</label>
      <button id="create">Create</button>
    </div>
  </div>

  <div class="card">
    <strong>Flags</strong>
    <table>
      <thead>
        <tr><th>Flag</th><th>State</th><th>Targeting</th><th>Actions</th></tr>
      </thead>
      <tbody id="flags"></tbody>
    </table>
  </div>

  <div class="card">
    <strong>Evaluate</strong>
    <div class="row" style="margin-top: 10px">
      <input id="e-flag" placeholder="flag-name" />
      <input id="e-user" placeholder="user id" value="user-1" />
      <input id="e-team" placeholder="team" />
      <button id="evaluate" class="secondary">Evaluate</button>
      <span id="e-result" class="muted"></span>
    </div>
  </div>

  <div class="card">
    <strong>Recent activity</strong>
    <ul class="audit" id="global-audit"></ul>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
