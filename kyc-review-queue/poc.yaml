# Platform manifest. Read by ../poc-platform: see poc-platform/docs/platform-contract.md.
schema_version: 1

id: kyc-review-queue
name: KYC Review Queue
summary: Compliance case triage with reasoned decisions, escalation and an audit trail.
owner: Compliance Experiments
stage: poc
stack: [FastAPI, SQLite, Vanilla JS]

runtime:
  command: ./run.sh
  port: 8001
  health_path: /healthz
  ready_timeout_seconds: 300

identity:
  mode: platform-headers
  roles: [analyst, senior_reviewer]
  default_role: analyst

data:
  classification: synthetic
  store: sqlite
  reset_command: rm -f "$PLATFORM_DATA_DIR/kyc.db"

capabilities:
  - Risk-ordered case queue with filters by risk level and status
  - Claim, approve, reject and escalate, each requiring a written reason
  - Escalated cases disappear from the analyst queue and only senior reviewers can override a closed case
  - Append-only decision history per case plus a global audit feed

limitations:
  - No document storage or verification; attachments are placeholder file names
  - No sanctions, PEP or watchlist screening, and no external identity-verification vendor
  - No SLA timers, case assignment, workload balancing or notifications
  - Synthetic customers and document numbers only; no real KYC data may be loaded
  - Identity is a trusted header, so any caller can act as a senior reviewer

docs: [README.md]
