<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KYC Review Queue</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f7f9; color: #1c1f23; }
    h1 { font-size: 20px; margin: 0; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .card { background: #fff; border: 1px solid #e2e5e9; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(340px, 2fr); gap: 20px; align-items: start; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eceef1; vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; color: #6b7280; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8fafc; }
    tbody tr.selected { background: #eef4ff; }
    input, select, button, textarea { font: inherit; padding: 6px 8px; border: 1px solid #cbd2d9; border-radius: 6px; }
    textarea { width: 100%; box-sizing: border-box; resize: vertical; }
    button { background: #1f6feb; color: #fff; border-color: #1f6feb; cursor: pointer; }
    button.secondary { background: #fff; color: #1c1f23; border-color: #cbd2d9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .pill { padding: 2px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
    .risk-high { background: #fee4e2; color: #b42318; }
    .risk-medium { background: #fef0c7; color: #b54708; }
    .risk-low { background: #dcfce7; color: #166534; }
    .status-new { background: #e0eaff; color: #1d4ed8; }
    .status-in_review { background: #ede9fe; color: #6d28d9; }
    .status-escalated { background: #ffe4e6; color: #9f1239; }
    .status-closed { background: #f1f3f5; color: #495057; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .muted { color: #6b7280; font-size: 12px; }
    #error { color: #b42318; }
    ul.plain { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
    .banner { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>KYC Review Queue</h1>
    <label>Acting as
      <select id="user"></select>
    </label>
    <span id="role" class="pill status-closed"></span>
    <span id="error"></span>
  </header>

  <div class="layout">
    <div>
      <div class="card">
        <div class="row">
          <strong>Queue</strong>
          <label>risk
            <select id="f-risk">
              <option value="">all</option>
              <option value="high">high</option>
              <option value="medium">medium</option>
              <option value="low">low</option>
            </select>
          </label>
          <label>status
            <select id="f-status">
              <option value="">all</option>
              <option value="new">new</option>
              <option value="in_review">in_review</option>
              <option value="escalated">escalated</option>
              <option value="closed">closed</option>
            </select>
          </label>
          <label>sort
            <select id="f-sort">
              <option value="risk">risk</option>
              <option value="status">status</option>
              <option value="oldest">oldest first</option>
              <option value="newest">newest first</option>
            </select>
          </label>
          <span id="count" class="muted"></span>
        </div>
        <table style="margin-top: 10px">
          <thead>
            <tr><th>Case</th><th>Customer</th><th>Risk</th><th>Status</th><th>Submitted</th></tr>
          </thead>
          <tbody id="cases"></tbody>
        </table>
      </div>

      <div class="card" id="escalated-card" hidden>
        <strong>Escalated queue</strong>
        <div class="muted">Visible to senior reviewers only. A senior reviewer can override the analyst's call.</div>
        <table style="margin-top: 10px">
          <thead>
            <tr><th>Case</th><th>Customer</th><th>Risk</th><th>Escalated because</th></tr>
          </thead>
          <tbody id="escalated"></tbody>
        </table>
      </div>

      <div class="card">
        <strong>Recent activity</strong>
        <ul class="plain" id="global-audit"></ul>
      </div>
    </div>

    <div class="card" id="detail">
      <span class="muted">Select a case to review it.</span>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
