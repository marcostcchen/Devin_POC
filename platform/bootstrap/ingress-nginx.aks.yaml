# ingress-nginx values for AKS: an internal Azure Load Balancer in front of two
# controller replicas. The only difference from the local cluster is how traffic
# reaches the controller; Ingress objects, hostnames and the auth subrequest to
# the platform portal are the same.
controller:
  replicaCount: 2
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
  ingressClassResource:
    name: nginx
    default: true
  config:
    auth-keepalive: "0"
    proxy-connect-timeout: "3"
    use-forwarded-headers: "true"
  metrics:
    enabled: true
