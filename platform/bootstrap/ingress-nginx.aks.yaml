# ingress-nginx values for AKS: an internal Azure Load Balancer in front of two
# controller replicas. The only difference from the local cluster is how traffic
# reaches the controller; the Ingress objects and hostnames are the same.
controller:
  replicaCount: 2
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
  ingressClassResource:
    name: nginx
    default: true
  config:
    use-forwarded-headers: "true"
