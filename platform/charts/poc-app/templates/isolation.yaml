{{/*
Everything that makes one namespace a boundary rather than a folder: a ceiling
on what the project can consume, a default request/limit for anything that
forgets to ask, a service account with no API access, and a network policy that
denies all traffic except the ingress controller in and DNS out.
*/}}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "poc-app.name" . }}-quota
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "poc-app.labels" . | nindent 4 }}
spec:
  hard:
    pods: "{{ .Values.quota.pods }}"
    limits.cpu: "{{ .Values.quota.cpuLimit }}"
    limits.memory: "{{ .Values.quota.memoryLimit }}"
    persistentvolumeclaims: "{{ .Values.quota.storageClaims }}"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "poc-app.name" . }}-limits
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "poc-app.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.runtime.resources.limits | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.runtime.resources.requests | nindent 8 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "poc-app.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "poc-app.labels" . | nindent 4 }}
# A POC has no business calling the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "poc-app.name" . }}-default-deny
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "poc-app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "poc-app.name" . }}-allow
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "poc-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "poc-app.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the shared ingress controller may reach the project, which is what
    # makes "every request has been through the auth subrequest" true.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: {{ .Values.runtime.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
