# Defaults for the generic project chart. `platformctl` fills these in from
# projects/<id>.yaml; the defaults exist so `helm template charts/poc-app` on
# its own still produces a valid release.

name: my-project
image: poc/my-project:0.1.0
replicas: 1

# The container listens on $PORT and answers this path when it is ready.
port: 8000
healthPath: /healthz

# Extra environment variables for the container, on top of PORT and DATA_DIR.
env: {}

host: my-project.poc.localhost
ingressClassName: nginx

# Small on purpose: this is a prototype, not a production workload.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
