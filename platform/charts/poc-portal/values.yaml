namespace: poc-platform

image:
  repository: poc/poc-portal
  tag: "0.1.0"
  pullPolicy: IfNotPresent

route:
  host: portal.poc.localhost
  ingressClassName: nginx
  tls:
    enabled: false
    clusterIssuer: ""

# Cookie domain for the persona the portal signs you in as. Must be the parent
# domain of every project host, or the sign-in will not follow you across them.
cookieDomain: poc.localhost

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The catalog, rendered by `platformctl` from platform.yaml, policy.yaml and
# projects/*.yaml. Mounted as /etc/poc-platform/platform.json.
config:
  platform:
    name: POC Platform
    domain: poc.localhost
    environment: poc
  principals: []
  projects: []
  guardrails:
    allowed: []
    not_allowed: []
