# The whole platform configuration. Everything else lives in projects/<id>.yaml.

# Every project is published at http://<host>.<domain>. Locally this is
# poc.localhost, which browsers resolve to 127.0.0.1 on their own.
domain: poc.localhost

# A project runs in the namespace <namespace_prefix><id>.
namespace_prefix: poc-

# Prefixed to every image name. Empty locally, where images are loaded straight
# into the kind cluster; on AKS this is the ACR login server.
registry: ""

ingress_class: nginx

# Port the ingress is reached on from a browser: 8080 on kind, 80 on AKS.
public_port: 8080
