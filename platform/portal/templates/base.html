<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ config.name }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◧</span>
        <span>
          <h1>{{ config.name }}</h1>
          <span class="brand-sub">Independent projects, one cluster, one door</span>
        </span>
      </div>
      <span class="env-badge">{{ config.environment }}</span>
      {% if current %}
        <span class="who">
          Signed in as <strong>{{ current.display_name }}</strong>
          <span class="muted">{{ current.email }}</span>
        </span>
        <form method="post" action="/logout"><button class="ghost">Sign out</button></form>
      {% else %}
        <a class="button primary" href="/login">Sign in</a>
      {% endif %}
    </header>
    <main>{% block main %}{% endblock %}</main>
  </body>
</html>
