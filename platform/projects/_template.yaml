# Copy this file to projects/<your-id>.yaml, fill it in, and run:
#
#   ./platformctl build <your-id> --load    # only on a local kind cluster
#   ./platformctl deploy <your-id>
#
# That is the whole onboarding. Nothing else on the platform changes.

id: my-project
name: My Project
summary: One sentence for whoever finds this file.

# Where the project's own repository is, relative to this directory. Only
# `platformctl build` uses it: deploying needs the image, not the source.
repo: ../my-project

image: poc/my-project:0.1.0

# Published at http://<host>.<the platform's domain>.
host: my-project

# Optional; the defaults are shown.
port: 8000
health_path: /healthz
replicas: 1
env: {}
