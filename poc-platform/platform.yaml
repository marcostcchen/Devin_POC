# Platform-level configuration: the gateway and the personas everyone shares.

gateway:
  host: 0.0.0.0
  port: 8080
  # Proxy read timeout for a request forwarded to a prototype.
  proxy_timeout_seconds: 60
  # Prototypes started when the gateway boots ("none", "all", or a list of ids).
  autostart: none

# Where prototypes live, relative to this file.
apps_root: ..

# Mocked identities. The console sends the selected persona to every prototype
# as `X-Platform-User`; each prototype's role comes from `app_roles` below.
# This is not authentication - see docs/poc-environment.md.
default_principal: ada@example.com
principals:
  - email: ada@example.com
    display_name: Ada Lovelace
    title: Platform engineer
    platform_role: platform_admin
    app_roles:
      feature-flag-admin: admin
      kyc-review-queue: senior_reviewer
      refunds-dashboard: finance_approver

  - email: nora@example.com
    display_name: Nora Okafor
    title: Compliance analyst
    platform_role: reviewer
    app_roles:
      feature-flag-admin: viewer
      kyc-review-queue: analyst
      refunds-dashboard: support_agent

  - email: dana@example.com
    display_name: Dana Reyes
    title: Finance approver
    platform_role: reviewer
    app_roles:
      feature-flag-admin: viewer
      kyc-review-queue: analyst
      refunds-dashboard: finance_approver

  - email: linus@example.com
    display_name: Linus Park
    title: Read-only stakeholder
    platform_role: observer
    app_roles:
      feature-flag-admin: viewer
      kyc-review-queue: analyst
      refunds-dashboard: support_agent
