<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Refunds Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f7f9; color: #1c1f23; }
    h1 { font-size: 20px; margin: 0; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .card { background: #fff; border: 1px solid #e2e5e9; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eceef1; vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; color: #6b7280; }
    td.amount, th.amount { text-align: right; }
    tr.request { cursor: pointer; }
    tr.request:hover { background: #f9fafb; }
    tr.request.selected { background: #eef4ff; }
    input, select, button, textarea { font: inherit; padding: 6px 8px; border: 1px solid #cbd2d9; border-radius: 6px; }
    input[type="number"] { width: 90px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 62px; }
    button { background: #1f6feb; color: #fff; border-color: #1f6feb; cursor: pointer; }
    button.secondary { background: #fff; color: #1c1f23; border-color: #cbd2d9; }
    button.danger { background: #b42318; border-color: #b42318; }
    button.warn { background: #b45309; border-color: #b45309; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .pill { padding: 2px 8px; border-radius: 999px; font-size: 12px; text-transform: uppercase; }
    .st-pending { background: #e0e7ff; color: #3730a3; }
    .st-approved { background: #cffafe; color: #155e75; }
    .st-denied { background: #fee2e2; color: #991b1b; }
    .st-processed { background: #dcfce7; color: #166534; }
    .threshold { background: #fef3c7; color: #92400e; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .muted { color: #6b7280; font-size: 12px; }
    .columns { display: flex; gap: 20px; align-items: flex-start; }
    .columns > .card:first-child { flex: 3; min-width: 0; }
    .columns > .card:last-child { flex: 2; min-width: 320px; }
    .metrics { display: flex; gap: 20px; flex-wrap: wrap; }
    .metric { min-width: 150px; }
    .metric .value { font-size: 22px; font-weight: 600; }
    #error { color: #b42318; }
    ul.history { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Refunds Dashboard</h1>
    <label>Acting as
      <select id="user"></select>
      <strong id="acting-as" hidden></strong>
    </label>
    <span id="role" class="pill st-approved"></span>
    <span id="error"></span>
  </header>

  <div class="card metrics" id="metrics"></div>

  <div class="card">
    <div class="row">
      <label>Status
        <select id="f-status">
          <option value="all">all</option>
          <option value="pending">pending</option>
          <option value="approved">approved</option>
          <option value="denied">denied</option>
          <option value="processed">processed</option>
        </select>
      </label>
      <label>Min $ <input id="f-min" type="number" min="0" step="10" /></label>
      <label>Max $ <input id="f-max" type="number" min="0" step="10" /></label>
      <label>Sort by
        <select id="f-sort">
          <option value="created_at">created</option>
          <option value="amount">amount</option>
          <option value="customer_name">customer</option>
          <option value="status">status</option>
        </select>
      </label>
      <label>Direction
        <select id="f-dir">
          <option value="desc">desc</option>
          <option value="asc">asc</option>
        </select>
      </label>
      <span id="count" class="muted"></span>
      <button class="secondary" id="new-toggle">New request</button>
    </div>
    <div class="row" id="new-form" hidden style="margin-top:10px">
      <input id="n-customer" placeholder="Customer name" />
      <input id="n-order" placeholder="ORD-2026-00042" />
      <input id="n-amount" type="number" min="0.01" step="0.01" placeholder="Amount" />
      <select id="n-reason"></select>
      <button id="n-submit">Raise request</button>
    </div>
  </div>

  <div class="columns">
    <div class="card">
      <strong>Queue</strong>
      <table>
        <thead>
          <tr><th>Order</th><th>Customer</th><th class="amount">Amount</th><th>Reason</th><th>Status</th></tr>
        </thead>
        <tbody id="requests"></tbody>
      </table>
      <p id="threshold-note" class="muted"></p>
    </div>

    <div class="card" id="detail">
      <strong>Request detail</strong>
      <p class="muted">Select a request from the queue.</p>
    </div>
  </div>

  <script src="static/app.js"></script>
</body>
</html>
